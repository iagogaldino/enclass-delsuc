<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practice</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f8f9fa;
            margin: 0;
            padding: 0;
            color: #333;
        }
        .container {
            width: 90%;
            max-width: 800px;
            margin: 2rem auto;

            border-radius: 8px;
            padding: 2rem;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }
        h1 {
            text-align: center;
            color: #e91e63;
            margin-bottom: 1.5rem;
        }
        .section {
            margin-bottom: 2rem;
        }
        h2 {
            font-size: 1.2rem;
            color: #1976d2;
            margin-bottom: 1rem;
        }
        input[type="text"] {
            width: 100%;
            padding: 0.5rem;
            margin: 0.5rem 0;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        input[type="text"]:focus {
            border-color: #9c27b0;
            outline: none;
        }
        .dialogue img {
            width: 40px;
            vertical-align: middle;
        }
        .dialogue {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

</head>

<div class="container">

    <div class="section">
